spring:
  application:
    name: aegis-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/aegis-public.pem

server:
  port: 8080

#management:
#  endpoints:
#    web:
#      exposure:
#        include: health,info,metrics
#  endpoint:
#    health:
#      probes:
#        enabled: true

aegis:
  gateway:
    engine:
      name: aegis-core-engine
      version: 0.0.1

    routes:
      - id: user-service-route
        target-uri: http://localhost:9001
        order: 10
        predicates:
          - name: Path
            args:
              patterns:
                - /gateway/users/**
          - name: Method
            args:
              methods:
                - GET
                - POST
                - PUT
                - DELETE
        metadata:
          aegis.proxy.strip-prefix: /gateway
          aegis.proxy.preserve-query: true

          aegis.security.authentication-required: true
          aegis.security.allowed-roles:
            - USER
            - ADMIN

      - id: order-service-route
        target-uri: http://localhost:9002
        order: 20
        predicates:
          - name: Path
            args:
              patterns:
                - /gateway/orders/**
          - name: Method
            args:
              methods:
                - GET
                - POST
        metadata:
          aegis.proxy.strip-prefix: /gateway
          aegis.proxy.preserve-query: true

          aegis.security.authentication-required: false



    security:
      subject-claim: sub
      roles-claim: roles
      scopes-claim: scope
      role-prefix: ROLE_

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs