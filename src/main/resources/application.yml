server:
  port: 8080

spring:
  application:
    name: aegis-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/aegis-public.pem


  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      connect-timeout: 2s
      timeout: 2s


aegis:
  gateway:
    engine:
      name: aegis-core-engine
      version: 0.0.1

    routes:
      - id: user-service-route
        service-id: user-service
        order: 10
        predicates:
          - name: Path
            args:
              patterns:
                - /gateway/users/**
          - name: Method
            args:
              methods:
                - GET
                - POST
                - PUT
                - DELETE
        metadata:
          aegis.proxy.strip-prefix: /gateway
          aegis.proxy.preserve-query: true

          aegis.security.authentication-required: true
          aegis.security.allowed-roles:
            - USER
            - ADMIN

          aegis.ratelimit.enabled: true
          aegis.ratelimit.capacity: 20
          aegis.ratelimit.refill-tokens: 10
          aegis.ratelimit.refill-period-ms: 1000
          aegis.ratelimit.tokens-per-request: 1
          aegis.ratelimit.key-resolver: principal
          aegis.ratelimit.fail-open: true



      - id: order-service-route
        target-uri: http://localhost:9002
        order: 20
        predicates:
          - name: Path
            args:
              patterns:
                - /gateway/orders/**
          - name: Method
            args:
              methods:
                - GET
                - POST
        metadata:
          aegis.proxy.strip-prefix: /gateway
          aegis.proxy.preserve-query: true
          aegis.security.authentication-required: false



    security:
      subject-claim: sub
      roles-claim: roles
      scopes-claim: scope
      role-prefix: ROLE_


    services:
      - id: user-service
        instances:

          - id: user-1
            uri: http://localhost:9001
            weight: 1
            enabled: true

          - id: user-2
            uri: http://localhost:9003
            weight: 1
            enabled: true

      - id: order-service
        instances:

          - id: order-1
            uri: http://localhost:9002
            weight: 1
            enabled: true

aegis.loadbalancer.strategy: random

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs